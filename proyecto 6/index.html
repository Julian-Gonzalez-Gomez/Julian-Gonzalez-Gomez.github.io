                            <a href="http://sedici.unlp.edu.ar/handle/10915/182282" target="_blank" rel="noopener noreferrer" class="text-xs text-blue-600 dark:text-blue-400 hover:underline inline-flex items-center space-x-1 mt-1"><i class="fa-solid fa-link"></i><span>SEDICI / EDULP</span></a>
                        </div>
                        <div class="p-3 bg-slate-50 dark:bg-slate-800/40 border border-slate-200 dark:border-slate-700 rounded space-y-1">
                            <p class="font-medium text-slate-900 dark:text-white">Fernández, S. y Del Río, J. P. (2010). <em>Sistemas de Información Geográfica para el Ordenamiento Territorial</em>. Ministerio de Infraestructura PBA.</p>
                        </div>
                        <div class="p-3 bg-slate-50 dark:bg-slate-800/40 border border-slate-200 dark:border-slate-700 rounded space-y-1">
                            <p class="font-medium text-slate-900 dark:text-white">Parellada, C. y Castorina, J. A. (2019). Una propuesta de diálogo entre la psicología del desarrollo y la cartografía crítica. <em>Cadernos de Pesquisa</em>.</p>
                            <a href="https://doi.org/10.1590/198053145469" target="_blank" rel="noopener noreferrer" class="text-xs text-blue-600 dark:text-blue-400 hover:underline inline-flex items-center space-x-1 mt-1"><i class="fa-solid fa-link"></i><span>DOI: 10.1590/198053145469</span></a>
                        </div>
                        <div class="p-3 bg-slate-50 dark:bg-slate-800/40 border border-slate-200 dark:border-slate-700 rounded space-y-1">
                            <p class="font-medium text-slate-900 dark:text-white">Sánchez Actis, T. et al. (2015). <em>Riesgos de inundación: conocimiento científico y saberes populares</em>. FaHCE-UNLP.</p>
                            <a href="http://www.memoria.fahce.unlp.edu.ar/trab_eventos/ev.9443/ev.9443.pdf" target="_blank" rel="noopener noreferrer" class="text-xs text-blue-600 dark:text-blue-400 hover:underline inline-flex items-center space-x-1 mt-1"><i class="fa-solid fa-link"></i><span>Memoria Académica FaHCE</span></a>
                        </div>
                    </div>
                `
            }
        ];

        function renderAccordions() {
            const container = document.getElementById('accordion-container');
            container.innerHTML = sectionsData.map(sec => `
                <div class="border border-slate-200 dark:border-slate-800 rounded bg-white dark:bg-slate-900 shadow-sm overflow-hidden">
                    <button onclick="toggleAccordion('${sec.id}')" class="w-full flex items-center justify-between p-4 sm:p-5 text-left bg-slate-50 dark:bg-slate-800/60 hover:bg-slate-100 dark:hover:bg-slate-800 transition focus:outline-none">
                        <div class="space-y-0.5 pr-2">
                            <h3 class="font-bold text-sm sm:text-base text-slate-900 dark:text-white flex items-center space-x-2">
                                <i class="fa-solid fa-folder text-amber-500"></i>
                                <span>${sec.title}</span>
                            </h3>
                            <p class="text-xs text-slate-500 dark:text-slate-400 pl-6">${sec.meta}</p>
                        </div>
                        <div class="flex items-center space-x-2 shrink-0">
                            <i id="icon-${sec.id}" class="fa-solid fa-chevron-down text-slate-500 text-sm chevron-icon ${sec.defaultOpen ? 'rotate-180' : ''}"></i>
                        </div>
                    </button>
                    <div id="content-${sec.id}" class="accordion-content ${sec.defaultOpen ? 'expanded' : ''}">
                        <div class="p-4 sm:p-5 border-t border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900">
                            ${sec.content}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function toggleAccordion(id) {
            const content = document.getElementById(`content-${id}`);
            const icon = document.getElementById(`icon-${id}`);
            const isExpanded = content.classList.contains('expanded');
            
            if (isExpanded) {
                content.classList.remove('expanded');
                icon.classList.remove('rotate-180');
            } else {
                content.classList.add('expanded');
                icon.classList.add('rotate-180');
            }
        }

        function toggleAll(open) {
            sectionsData.forEach(sec => {
                const content = document.getElementById(`content-${sec.id}`);
                const icon = document.getElementById(`icon-${sec.id}`);
                if (open) {
                    content.classList.add('expanded');
                    icon.classList.add('rotate-180');
                } else {
                    content.classList.remove('expanded');
                    icon.classList.remove('rotate-180');
                }
            });
        }

        // Obtener / Incrementar contador de visitas vía CountAPI
        async function fetchVisitCount() {
            const counterEl = document.getElementById('visit-count');
            try {
                const response = await fetch('https://api.countapi.xyz/hit/sig-aula-virtual-unlp/visitas');
                const data = await response.json();
                if (data && typeof data.value === 'number') {
                    counterEl.textContent = data.value.toLocaleString();
                } else {
                    counterEl.textContent = '1+';
                }
            } catch (err) {
                let localVisits = localStorage.getItem('sig_visits');
                localVisits = localVisits ? parseInt(localVisits) + 1 : 1;
                localStorage.setItem('sig_visits', localVisits);
                counterEl.textContent = localVisits.toLocaleString();
            }
        }

        let deferredPrompt;
        const installBtn = document.getElementById('installBtn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.classList.remove('hidden');
            installBtn.classList.add('flex');
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                deferredPrompt = null;
                installBtn.classList.add('hidden');
            }
        });

        const themeToggle = document.getElementById('themeToggle');
        const htmlElement = document.documentElement;

        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            htmlElement.classList.add('dark');
        } else {
            htmlElement.classList.remove('dark');
        }

        themeToggle.addEventListener('click', () => {
            if (htmlElement.classList.contains('dark')) {
                htmlElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                htmlElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
        });

        window.onload = function() {
            renderAccordions();
            fetchVisitCount();
        };
    </script>
</body>
</html>
